<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:15px}.box{background:#1a1a1a;padding:20px;border-radius:15px;max-width:450px;margin:auto}select,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px}select{background:#2a2a2a;color:#fff}button{background:#00ff88;font-weight:bold}.keybox{background:#000;padding:15px;border-radius:10px;margin-top:15px;word-break:break-all;border:1px solid #00ff88;display:none}.wallet{background:#222;padding:12px;border-radius:10px;margin-bottom:15px;display:flex;justify-content:space-between}table{width:100%;margin-top:15px;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #333;text-align:left}</style></head><body><div class="box"><div class="wallet"><span>Hi {{user['username']}}</span><span><b id="bal">{{user['balance']}} Rs</b> | <a href="/logout" style="color:#ff4444">Logout</a></span></div><h3>Generate - 16/35/65/120</h3><select id="product">{% for pid,p in products.items() %}<option value="{{pid}}">{{p.name}}</option>{% endfor %}</select><select id="duration">{% for d in durations %}<option value="{{d}}">{{d}} - {{sell_price[d]}} Rs</option>{% endfor %}</select><button onclick="gen()">Generate Key</button><div id="result" class="keybox"></div><h4 style="margin-top:20px">My History</h4><table><tr><th>Product</th><th>Key</th><th>Time</th></tr>{% for h in histories %}<tr><td>{{h['product_name']}}</td><td style="font-size:11px">{{h['key_text']}}</td><td>{{h['created_at']}}</td></tr>{% else %}<tr><td colspan="3" style="text-align:center;color:#888">No keys</td></tr>{% endfor %}</table>{% if session.get('is_admin') %}<p style="text-align:center"><a href="/admin" style="color:#00ff88">Admin Panel</a></p>{% endif %}</div><script>function gen(){let b=document.querySelector("button");b.innerText="Generating...";fetch("/generate",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`product_id=${document.getElementById('product').value}&duration=${document.getElementById('duration').value}`}).then(r=>r.json().then(j=>({s:r.status,j}))).then(d=>{b.innerText="Generate Key";let r=document.getElementById("result");r.style.display="block";if(d.s!=200){r.innerHTML="❌ "+d.j.error;r.style.borderColor="red"}else{r.innerHTML="✅ <b style='color:#00ff88'>"+d.j.key+"</b><br>New Bal: "+d.j.new_balance;document.getElementById("bal").innerText=d.j.new_balance+" Rs";setTimeout(()=>location.reload(),1500)}})}</script></body></html>
